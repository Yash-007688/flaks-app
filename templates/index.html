<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Patrak Portal</title>
    <link rel="stylesheet" href="/static/yash.css">
    <style>
        .hero-container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
        }

        .hero-container h1 {
            font-size: 48px;
            color: #1f2937;
            margin-bottom: 16px;
            font-weight: 800;
        }

        .hero-container p {
            font-size: 18px;
            color: #4b5563;
            background: none;
            border: none;
            margin-bottom: 32px;
        }

        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(102, 126, 234, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(118, 75, 162, 0.35);
            color: white;
            text-decoration: none;
        }

        .btn-secondary {
            background: white;
            color: #4b5563;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: #667eea;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="hero-container">
        <h1>Patrak Data Portal</h1>
        <p>A secure, encrypted platform to view and track institutional data spreadsheets efficiently.</p>

        <div class="button-group">
            <a href="/login" class="btn-primary">Sign In</a>
            <a href="/register" class="btn-secondary">Create Account</a>
        </div>
    </div>
</body>

</html>
